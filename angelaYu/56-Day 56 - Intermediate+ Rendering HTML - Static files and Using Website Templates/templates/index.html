<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name — Digital Name Card</title>
    <!-- static files live in the static/ folder (Flask rule) -->
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <main class="card">
        <img class="avatar" src="static/images/avatar.png" alt="Your photo">
        <h1>Hi, I'm Your Name 👋</h1>
        <p class="tagline">Python developer · 100 Days of Code</p>

        <nav class="links">
            <a href="https://github.com/yourhandle">GitHub</a>
            <a href="https://twitter.com/yourhandle">Twitter / X</a>
            <a href="https://linkedin.com/in/yourhandle">LinkedIn</a>
            <a href="mailto:you@example.com">Email</a>
        </nav>

        <footer>
            Template inspired by <a href="https://html5up.net">HTML5 UP</a>
        </footer>
    </main>
</body>
</html>
