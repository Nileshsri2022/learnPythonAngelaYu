<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secrets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('logout') }}">Log out</a>
        <span class="who">Logged in as {{ current_user.email }}</span>
    </nav>

    <h1>Hello, {{ name }}! 🔒</h1>
    <p class="lead">
        This page is protected by <code>@login_required</code> — anonymous visitors are
        redirected to the login page before they ever see it.
    </p>

    <p>Only you can see this, because the server knows who you are from your session.</p>
</body>
</html>
