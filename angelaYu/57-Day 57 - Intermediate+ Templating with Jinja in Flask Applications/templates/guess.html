<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guess</title>
</head>
<body>
    <!-- name.title() proves you can call Python methods inside {{ }} -->
    <h1>Hey {{ name.title() }},</h1>
    <h2>I think you are {{ gender }},</h2>
    <h3>And maybe {{ age }} years old.</h3>

    <p><a href="{{ url_for('get_all_posts') }}">← Home</a></p>
</body>
</html>
