<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog</title>
</head>
<body>
    <h1>Blog</h1>
    <p>You asked for blog page number {{ number }}.</p>

    {# a simple conditional inside a loop: only post id 2 renders #}
    {% for post in posts %}
        {% if post.id == 2 %}
            <h2>{{ post.title }}</h2>
            <h3>{{ post.subtitle }}</h3>
        {% endif %}
    {% endfor %}

    <p><a href="{{ url_for('get_all_posts') }}">← Home</a></p>
</body>
</html>
