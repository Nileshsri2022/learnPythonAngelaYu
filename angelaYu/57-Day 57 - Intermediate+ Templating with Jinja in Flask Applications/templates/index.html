<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
</head>
<body>
    <h1>My Blog</h1>
    <p><a href="{{ url_for('get_blog', number=3) }}">Blog page number 3</a></p>
    <p><a href="{{ url_for('guess', name='Angela') }}">Guess my age</a></p>

    <!-- {% for %} ... {% endfor %}: one card per post, no repeated HTML files -->
    {% for post in posts %}
        <h2>{{ post.title }}</h2>
        <h3>{{ post.subtitle }}</h3>
        <a href="{{ url_for('show_post', index=post.id) }}">Read</a>
        <hr>
    {% endfor %}

    <footer>
        <!-- {{ year }} is computed in server.py, so it never goes stale -->
        <p>Copyright {{ year }}. Built by Your Name.</p>
    </footer>
</body>
</html>
