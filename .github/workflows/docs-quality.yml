# Content-quality gates for the study notes and the docs site.
#
# Runs on every push / pull request that touches the notes or the docs-site:
#   1. normalize_notes.py --check  → notes are structurally consistent
#      (H1 title, no filler preamble, no HTML entities, fences labelled …)
#   2. check_notes.py              → no broken structure, and a fidelity report of
#      notes whose code does not appear in the matching transcript
#   3. mkdocs build --strict       → the site builds with zero warnings
#   4. check_links.py              → every internal link resolves, no thin pages

name: Docs quality

on:
  push:
    paths:
      - "angelaYu/**"
      - "docs-site/**"
      - ".github/workflows/docs-quality.yml"
  pull_request:
    paths:
      - "angelaYu/**"
      - "docs-site/**"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Notes are normalised
        run: python3 docs-site/tools/normalize_notes.py --check

      - name: Notes pass the structural + fidelity checks
        run: python3 docs-site/check_notes.py --report

      - name: Build the site (strict)
        run: mkdocs build --strict
        working-directory: docs-site

      - name: Verify the built site
        run: python3 check_links.py --external-sample 0
        working-directory: docs-site
